<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" class="lp">
  <style>svg.lp { --lp-bg-a: #ffffff; --lp-bg-b: #f3f3f1; --lp-ink: #131313; --lp-dim: #6b6b68; --lp-line: rgba(0,0,0,0.14); --lp-faint: rgba(0,0,0,0.06); }</style>
  <defs>
    <linearGradient id="lpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lp-bg-a)"/>
      <stop offset="1" stop-color="var(--lp-bg-b)"/>
    </linearGradient>
    <filter id="lpgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="420" fill="url(#lpg)"/>
  
  <text x="324" y="108" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">MODEL A</text><rect x="340" y="90" width="397.59999999999997" height="26" rx="5" fill="var(--lp-dim)" opacity="0.8"/><text x="747.5999999999999" y="108" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-dim)">0.71</text><text x="324" y="164" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">MODEL B</text><rect x="340" y="146" width="386.4" height="26" rx="5" fill="var(--lp-dim)" opacity="0.8"/><text x="736.4" y="164" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-dim)">0.69</text><text x="324" y="220" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">MODEL C</text><rect x="340" y="202" width="369.6" height="26" rx="5" fill="var(--lp-dim)" opacity="0.8"/><text x="719.6" y="220" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-dim)">0.66</text><text x="324" y="276" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">BLEND, SCORED ON ITS OWN FIT ROWS</text><rect x="340" y="258" width="464.79999999999995" height="26" rx="5" fill="#a78bfa" opacity="0.8"/><text x="814.8" y="276" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#a78bfa">0.83</text><text x="324" y="332" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">BLEND, SCORED ON A HELD-OUT SPLIT</text><rect x="340" y="314" width="414.4" height="26" rx="5" fill="#a3e635" opacity="0.8"/><text x="764.4" y="332" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#a3e635">0.74</text><path d="M340 248H970" stroke="var(--lp-line)" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="396" font-family="Geist Mono, ui-monospace, monospace" font-size="13" fill="var(--lp-dim)">same weights, same models. only the rows they were graded on changed.</text>
  <rect width="1000" height="420" filter="url(#lpgrain)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="999" height="419" fill="none" stroke="var(--lp-line)"/>
</svg>