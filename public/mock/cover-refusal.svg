<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" class="lp">
  <style>svg.lp { --lp-bg-a: #141416; --lp-bg-b: #0d0d0e; --lp-ink: #f2f2f2; --lp-dim: #8f8f8f; --lp-line: rgba(255,255,255,0.14); --lp-faint: rgba(255,255,255,0.06); } @media (prefers-color-scheme: light) { svg.lp { --lp-bg-a: #ffffff; --lp-bg-b: #f3f3f1; --lp-ink: #131313; --lp-dim: #6b6b68; --lp-line: rgba(0,0,0,0.14); --lp-faint: rgba(0,0,0,0.06); } }</style>
  <defs>
    <linearGradient id="lpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lp-bg-a)"/>
      <stop offset="1" stop-color="var(--lp-bg-b)"/>
    </linearGradient>
    <filter id="lpgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="500" fill="url(#lpg)"/>
  
  <rect x="330" y="110" width="380" height="18" rx="9" fill="#22d3ee" opacity="0.75"/><rect x="330" y="142" width="380" height="18" rx="9" fill="#22d3ee" opacity="0.75"/><rect x="330" y="174" width="380" height="18" rx="9" fill="#22d3ee" opacity="0.75"/><rect x="330" y="206" width="380" height="18" rx="9" fill="#22d3ee" opacity="0.75"/><rect x="330" y="238" width="180" height="18" rx="9" fill="var(--lp-dim)" opacity="0.25"/><rect x="330" y="270" width="180" height="18" rx="9" fill="var(--lp-dim)" opacity="0.25"/><rect x="330" y="302" width="180" height="18" rx="9" fill="var(--lp-dim)" opacity="0.25"/><rect x="330" y="334" width="180" height="18" rx="9" fill="var(--lp-dim)" opacity="0.25"/><rect x="330" y="366" width="180" height="18" rx="9" fill="var(--lp-dim)" opacity="0.25"/><path d="M320 230H760" stroke="var(--lp-ink)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="770" y="235" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="var(--lp-ink)">threshold</text>
     <text x="60" y="460" font-family="Geist Mono, ui-monospace, monospace" font-size="17" letter-spacing="1.6" fill="var(--lp-dim)">A SYSTEM THAT CANNOT REFUSE CANNOT BE TRUSTED</text>
  <rect width="1000" height="500" filter="url(#lpgrain)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="999" height="499" fill="none" stroke="var(--lp-line)"/>
</svg>