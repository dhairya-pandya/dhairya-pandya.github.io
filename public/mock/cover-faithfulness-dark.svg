<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" class="lp">
  <style>svg.lp { --lp-bg-a: #141416; --lp-bg-b: #0d0d0e; --lp-ink: #f2f2f2; --lp-dim: #8f8f8f; --lp-line: rgba(255,255,255,0.14); --lp-faint: rgba(255,255,255,0.06); }</style>
  <defs>
    <linearGradient id="lpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lp-bg-a)"/>
      <stop offset="1" stop-color="var(--lp-bg-b)"/>
    </linearGradient>
    <filter id="lpgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="500" fill="url(#lpg)"/>
  
  <rect x="150" y="130" width="520" height="16" rx="8" fill="var(--lp-dim)" opacity="0.45"/><rect x="150" y="176" width="400" height="16" rx="8" fill="var(--lp-dim)" opacity="0.45"/><rect x="150" y="222" width="520" height="16" rx="8" fill="var(--lp-dim)" opacity="0.45"/><rect x="150" y="268" width="400" height="16" rx="8" fill="var(--lp-dim)" opacity="0.45"/><rect x="150" y="314" width="520" height="16" rx="8" fill="var(--lp-dim)" opacity="0.45"/><rect x="150" y="360" width="520" height="16" rx="8" fill="#f59e0b" opacity="0.8"/><text x="700" y="374" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#f59e0b">answer does not follow</text>
    <text x="60" y="460" font-family="Geist Mono, ui-monospace, monospace" font-size="17" letter-spacing="1.6" fill="var(--lp-dim)">THE REASONING YOU CAN READ</text>
  <rect width="1000" height="500" filter="url(#lpgrain)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="999" height="499" fill="none" stroke="var(--lp-line)"/>
</svg>