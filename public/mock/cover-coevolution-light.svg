<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" class="lp">
  <style>svg.lp { --lp-bg-a: #ffffff; --lp-bg-b: #f3f3f1; --lp-ink: #131313; --lp-dim: #6b6b68; --lp-line: rgba(0,0,0,0.14); --lp-faint: rgba(0,0,0,0.06); }</style>
  <defs>
    <linearGradient id="lpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lp-bg-a)"/>
      <stop offset="1" stop-color="var(--lp-bg-b)"/>
    </linearGradient>
    <filter id="lpgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="420" fill="url(#lpg)"/>
  
  <text x="140" y="70" font-family="Geist Mono, ui-monospace, monospace" font-size="17" letter-spacing="1" fill="var(--lp-dim)">RAW MUTUAL INFORMATION</text><text x="620" y="70" font-family="Geist Mono, ui-monospace, monospace" font-size="17" letter-spacing="1" fill="var(--lp-dim)">AFTER SUBTRACTING NOISE</text><rect x="140" y="110" width="218.4" height="26" rx="5" fill="#fb7185" opacity="0.75"/>
      <text x="140" y="102" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">A · B</text><rect x="140" y="184" width="187.20000000000002" height="26" rx="5" fill="#fb7185" opacity="0.75"/>
      <text x="140" y="176" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">C · D</text><rect x="140" y="258" width="98.39999999999999" height="26" rx="5" fill="#22d3ee" opacity="0.75"/>
      <text x="140" y="250" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">E · F</text><rect x="140" y="332" width="84" height="26" rx="5" fill="var(--lp-dim)" opacity="0.75"/>
      <text x="140" y="324" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">G · H</text><rect x="620" y="110" width="199.2" height="26" rx="5" fill="#22d3ee" opacity="0.75"/>
      <text x="620" y="102" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">E · F  quiet, but moves together</text><rect x="620" y="184" width="81.60000000000001" height="26" rx="5" fill="#fb7185" opacity="0.75"/>
      <text x="620" y="176" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">A · B  both just noisy</text><rect x="620" y="258" width="69.6" height="26" rx="5" fill="#fb7185" opacity="0.75"/>
      <text x="620" y="250" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">C · D  both just noisy</text><rect x="620" y="332" width="52.8" height="26" rx="5" fill="var(--lp-dim)" opacity="0.75"/>
      <text x="620" y="324" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="var(--lp-ink)">G · H</text><path d="M386 123 C 380 123, 380 197, 614 197" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.5"/><path d="M386 197 C 380 197, 380 271, 614 271" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.5"/><path d="M386 271 C 380 271, 380 123, 614 123" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/><path d="M386 345 C 380 345, 380 345, 614 345" fill="none" stroke="var(--lp-line)" stroke-width="1.5" opacity="0.5"/>
