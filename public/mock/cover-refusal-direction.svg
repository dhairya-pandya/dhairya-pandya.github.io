<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" class="lp">
  <style>svg.lp { --lp-bg-a: #141416; --lp-bg-b: #0d0d0e; --lp-ink: #f2f2f2; --lp-dim: #8f8f8f; --lp-line: rgba(255,255,255,0.14); --lp-faint: rgba(255,255,255,0.06); } @media (prefers-color-scheme: light) { svg.lp { --lp-bg-a: #ffffff; --lp-bg-b: #f3f3f1; --lp-ink: #131313; --lp-dim: #6b6b68; --lp-line: rgba(0,0,0,0.14); --lp-faint: rgba(0,0,0,0.06); } }</style>
  <defs>
    <linearGradient id="lpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lp-bg-a)"/>
      <stop offset="1" stop-color="var(--lp-bg-b)"/>
    </linearGradient>
    <filter id="lpgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="500" fill="url(#lpg)"/>
  
  <circle cx="140" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="235" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="330" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="425" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="520" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="615" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="710" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="805" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><circle cx="900" cy="250" r="9" fill="var(--lp-dim)" opacity="0.5"/><path d="M140 380 L 800 120" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/><path d="M800 120 l-22 4 m22 -4 l-6 20" stroke="#a3e635" stroke-width="4" stroke-linecap="round" fill="none"/><text x="820" y="112" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#a3e635">refusal direction</text>
    <text x="60" y="460" font-family="Geist Mono, ui-monospace, monospace" font-size="17" letter-spacing="1.6" fill="var(--lp-dim)">ONE DIRECTION, ONE EDIT</text>
  <rect width="1000" height="500" filter="url(#lpgrain)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="999" height="499" fill="none" stroke="var(--lp-line)"/>
</svg>